sections:
  - type: "content"
    title: "Your Voice Matters: Shape Ansari 4"
    icon: "https://drive.google.com/thumbnail?id=12HdfMWPPcUAAgJwfzbbBbophMHIcBU6d"
    paragraphs:
      - "We're planning the next major version of Ansari and need YOUR input! We've prepared a brief survey to understand which features would be most valuable to our community."
    feature_list_intro: "**Top potential features include:**"
    feature_list:
      - "⚡ Progressive Response Mode (get instant answers that enhance with citations)"
      - "🎯 Dynamic Suggestions (contextual follow-up questions)"
      - "🧠 Model Selection (choose between Claude, Gemini, and other AI models)"
      - "📚 Guided Learning Mode (personalized Islamic learning plans)"
      - "🎙️ Voice Conversations (speak your questions, hear the answers)"
      - "📄 File Upload Support (analyze PDFs and images of Islamic texts)"
    cta_buttons:
      - text: "Take the 2-minute survey →"
        link: "https://forms.gle/4UP4mwpkNQbyyPSB7"
    paragraphs_after_cta:
      - "Your feedback will directly influence our development priorities for Ansari 4."

  - type: "content"
    title: "Recent Presentations featuring Ansari"
    icon: "https://drive.google.com/thumbnail?id=1a6iXO_t84QFwUIU6Kc9cpuxKQHbViBi2"
    subsections:
      - title: "Qur'an Computing Conference 2025"
        paragraphs:
          - "We presented \"Advances in AI Assistants for Enhancing Qur'anic Understanding: The Ansari Chat Journey\" at the International Qur'an Computing Conference. Of special interest is the statistical analysis of the questions people ask, the languages they use and how happy are people with Ansari."
        link: "https://slideshare.net/slideshow/advances-in-ai-assistants-for-enhancing-qur-anic-understanding-the-ansari-chat-journey/283120585"
        link_text: "View the presentation slides"
      - title: "AMJA Workshop: \"Imam 2.0: Leveraging AI to Enhance Islamic Leadership\""
        paragraphs:
          - "Drs. Waleed Kadous and Hidayah Ansari presented an interactive workshop at AMJA's 21st Annual Imams' Conference titled \"Imam 2.0: Leveraging AI to Enhance Islamic Leadership.\""
          - "The workshop featured hands-on activities demonstrating how Imams can integrate AI tools like Ansari into their daily work, from sermon preparation to community outreach. Ansari was extensively demonstrated live."

  - type: "content"
    title: "Ansari is Now Available as an MCP Server"
    icon: "https://drive.google.com/thumbnail?id=1WRt7UoDOxhka8d1QQa4poYIgxOKiPOME"
    paragraphs:
      - "**For developers and advanced users:** We're excited to announce that Ansari is now available as a Model Context Protocol (MCP) server. MCP is a new standard that allows AI tools like Claude Desktop, Claude Code, and Cursor to integrate specialized knowledge sources."
      - "With the Ansari MCP server, you can:"
    feature_list:
      - "Access Islamic knowledge directly within your AI development environment"
      - "Get authentic answers with citations from Quran and Hadith"
      - "Build Islamic applications with verified religious sources"
    paragraphs_after_features:
      - "**Getting Started:**"
      - "See installation instructions at [github.com/ansari-project/ansari-mcp](https://github.com/ansari-project/ansari-mcp)."
      - "*Note: This feature is currently for technical users. We're working on making Ansari's advanced capabilities accessible to everyone in future updates.*"

  - type: "contributors"
    title: "Community Acknowledgment"
    icon: "https://drive.google.com/thumbnail?id=1Jvbt9UInwL5ZCUa9YZUtDD3rSZkmNUT7"
