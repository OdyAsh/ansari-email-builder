<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Email envelope background -->
  <rect width="64" height="64" fill="#08786b" rx="8"/>

  <!-- Email envelope shape -->
  <rect x="8" y="16" width="48" height="32" fill="#0a9988" stroke="#ffffff" stroke-width="1" rx="2"/>

  <!-- Opened email flap - flipped upward -->
  <polygon points="8,16 32,8 56,16" fill="#0cb5a3" stroke="#ffffff" stroke-width="1"/>

  <!-- Email content visible inside -->
  <rect x="12" y="20" width="40" height="24" fill="#ffffff" opacity="0.9" rx="1"/>

  <!-- Email content lines -->
  <rect x="16" y="24" width="32" height="1" fill="#08786b" opacity="0.7"/>
  <rect x="16" y="28" width="28" height="1" fill="#08786b" opacity="0.5"/>
  <rect x="16" y="32" width="24" height="1" fill="#08786b" opacity="0.5"/>
  <rect x="16" y="36" width="30" height="1" fill="#08786b" opacity="0.5"/>

  <!-- Ansari star pattern (simplified) centered on envelope -->
  <g transform="translate(32,32) scale(0.4)">
    <!-- Main star shape inspired by the logo -->
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#08786b" opacity="0.6"/>

    <!-- Inner details -->
    <polygon points="0,-8 2.5,-2.5 8,0 2.5,2.5 0,8 -2.5,2.5 -8,0 -2.5,-2.5" fill="#0a9988"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="2" fill="#08786b"/>
  </g>

  <!-- Email lines for additional email context -->
  <rect x="12" y="52" width="16" height="1" fill="#ffffff" opacity="0.6"/>
  <rect x="32" y="52" width="20" height="1" fill="#ffffff" opacity="0.6"/>
</svg>